<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Employees - HCM Lite</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>HCM Lite</h2>
      <button onclick="toggleSidebar()" class="mobile-menu-btn">✕</button>
    </div>
    <div class="sidebar-nav">
      <a href="admin.html">Dashboard</a>
      <a href="employees.html" class="active">Employees</a>
      <a href="leaves.html">Leave Requests</a>
      <a href="settings.html">Settings</a>
      <a href="payslip.html">Payslips</a>
    </div>
  </div>

  <div class="main-wrapper">
    <header>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <div style="font-weight: 600;">Manage Employees</div>
      </div>
      <div class="header-user">
        <span id="headerUserName">Admin User</span>
        <button class="btn-logout" onclick="handleLogout()">Logout</button>
      </div>
    </header>

    <div class="content-area" style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px;">
      <div>
        <div style="display: flex; gap: 12px; margin-bottom: 20px;">
          <input type="text" id="searchInput" placeholder="Search by name/email..." onkeyup="filterEmployees()" style="flex: 1; padding: 12px 16px; background: rgba(26,26,34,0.85); border: 1px solid var(--border-color); color: #fff; border-radius: 12px; outline: none;">
          <select id="deptFilter" onchange="filterEmployees()" style="padding: 12px 16px; background: rgba(26,26,34,0.85); border: 1px solid var(--border-color); color: #fff; border-radius: 12px; outline: none; cursor: pointer;">
            <option value="">All Departments</option>
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Finance">Finance</option>
            <option value="Management">Management</option>
          </select>
        </div>

        <div class="data-table-container">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="employeeTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="chart-box" style="height: fit-content;">
        <h3 style="margin-bottom: 20px; color: var(--text-dark);">Add Employee</h3>
        <form id="addEmployeeForm" onsubmit="addEmployee(event)">
          <div class="form-group">
            <label>Full Name</label>
            <div class="input-wrapper">
              <input type="text" id="empName" required placeholder="Enter full name" style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: #fff; border-radius: 12px; outline: none;">
            </div>
          </div>
          <div class="form-group">
            <label>Email</label>
            <div class="input-wrapper">
              <input type="email" id="empEmail" required placeholder="Enter email" style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: #fff; border-radius: 12px; outline: none;">
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrapper">
              <input type="password" id="empPassword" required placeholder="Enter password" style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: #fff; border-radius: 12px; outline: none;">
            </div>
          </div>
          <div class="form-group">
            <label>Department</label>
            <div class="input-wrapper">
              <select id="empDept" style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: #fff; border-radius: 12px; outline: none; cursor: pointer;">
                <option value="IT" style="background:#1a1a1e;">IT</option>
                <option value="HR" style="background:#1a1a1e;">HR</option>
                <option value="Finance" style="background:#1a1a1e;">Finance</option>
                <option value="Management" style="background:#1a1a1e;">Management</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Salary (PKR)</label>
            <div class="input-wrapper">
              <input type="number" id="empSalary" required placeholder="100000" style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: #fff; border-radius: 12px; outline: none;">
            </div>
          </div>
          <button type="submit" class="btn-primary" style="width: 100%;">Add Employee</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    checkAuth();
    const session = DB.getSession();
    if (session) {
      document.getElementById("headerUserName").innerText = session.name;
    }

    if (!localStorage.getItem("hcm_employees")) {
      localStorage.setItem("hcm_employees", JSON.stringify([
        { id: 1, name: "raza", email: "raza@gmail.com", department: "IT", salary: 100000 }
      ]));
    }

    DB.getEmployees = () => JSON.parse(localStorage.getItem("hcm_employees")) || [];
    DB.setEmployees = (emps) => localStorage.setItem("hcm_employees", JSON.stringify(emps));

    function renderEmployees(list) {
      const tbody = document.getElementById("employeeTableBody");
      let rows = list.map(emp => `
        <tr>
          <td>${emp.name}</td>
          <td>${emp.email}</td>
          <td>${emp.department || 'IT'}</td>
          <td>PKR ${(emp.salary || 100000).toLocaleString()}</td>
          <td>
            <button onclick="deleteEmployee(${emp.id})" class="btn-primary" style="padding: 6px 12px; font-size: 0.85rem; background: var(--danger);">Delete</button>
          </td>
        </tr>
      `).join('');

      if (!rows) rows = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">No employees found.</td></tr>`;
      tbody.innerHTML = rows;
    }

    renderEmployees(DB.getEmployees());

    function addEmployee(e) {
      e.preventDefault();
      const name = document.getElementById("empName").value;
      const email = document.getElementById("empEmail").value;
      const department = document.getElementById("empDept").value;
      const salary = parseFloat(document.getElementById("empSalary").value);

      const emps = DB.getEmployees();
      emps.push({ id: Date.now(), name, email, department, salary });
      DB.setEmployees(emps);

      document.getElementById("addEmployeeForm").reset();
      renderEmployees(DB.getEmployees());
      alert("Employee added successfully!");
    }

    function deleteEmployee(id) {
      if (confirm("Are you sure you want to delete this employee?")) {
        let emps = DB.getEmployees();
        emps = emps.filter(e => e.id !== id);
        DB.setEmployees(emps);
        renderEmployees(DB.getEmployees());
      }
    }

    function filterEmployees() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const dept = document.getElementById("deptFilter").value;
      let emps = DB.getEmployees();

      emps = emps.filter(e => {
        const matchesQuery = e.name.toLowerCase().includes(query) || e.email.toLowerCase().includes(query);
        const matchesDept = dept ? e.department === dept : true;
        return matchesQuery && matchesDept;
      });

      renderEmployees(emps);
    }

    function toggleSidebar() {
      document.querySelector(".sidebar").classList.toggle("mobile-open");
    }
  </script>
</body>
</html>
