<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - HCM Lite</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>HCM Lite</h2>
      <button onclick="toggleSidebar()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;" class="mobile-menu-btn">✕</button>
    </div>
    <div class="sidebar-nav" id="sidebarNavLinks"></div>
  </div>

  <div class="main-wrapper">
    <header>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <div id="headerTitle" style="font-weight: 600;">System Settings</div>
      </div>
      <div class="header-user">
        <span id="headerUserName">User</span>
        <button class="btn-logout" onclick="handleLogout()">Logout</button>
      </div>
    </header>

    <div class="content-area" id="settingsContentArea">
      <div style="max-width: 600px; margin: 0 auto;" class="chart-box">
        <h3 style="margin-bottom: 20px; color: var(--text-dark);">Company Settings</h3>
        <form id="settingsForm" onsubmit="saveSettings(event)">
          <div class="form-group">
            <label>Company Name</label>
            <div class="input-wrapper">
              <input type="text" id="companyName" value="HCM Lite Inc." required style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; border-radius: 12px; outline: none;">
            </div>
          </div>
          <div class="form-group">
            <label>Annual Leave Quota</label>
            <div class="input-wrapper">
              <input type="number" id="leaveQuota" value="20" required style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; border-radius: 12px; outline: none;">
            </div>
          </div>
          <button type="submit" class="btn-primary" style="width: 100%;">Save Settings</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    checkAuth();
    const session = DB.getSession();
    if (session) {
      document.getElementById("headerUserName").innerText = session.name;
      const navLinks = document.getElementById("sidebarNavLinks");
      if (session.role === "admin") {
        navLinks.innerHTML = `
          <a href="admin.html">Dashboard</a>
          <a href="employees.html">Employees</a>
          <a href="leaves.html">Leave Requests</a>
          <a href="settings.html" class="active">Settings</a>
          <a href="payslip.html">Payslips</a>
        `;
      } else {
        navLinks.innerHTML = `
          <a href="employee.html">My Dashboard</a>
          <a href="leaves.html">Leaves</a>
          <a href="payslip.html">My Payslip</a>
        `;
      }
    }

    function saveSettings(e) {
      e.preventDefault();
      const companyName = document.getElementById("companyName").value;
      const leaveQuota = document.getElementById("leaveQuota").value;
      DB.setCompany({ name: companyName, leaveQuota });
      alert("Settings saved successfully!");
    }

    function toggleSidebar() {
      const sidebar = document.querySelector(".sidebar");
      sidebar.classList.toggle("mobile-open");
    }
  </script>
</body>
</html>
