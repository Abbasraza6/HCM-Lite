<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - HCM Lite</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>HCM Lite</h2>
      <button onclick="toggleSidebar()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;" class="mobile-menu-btn">✕</button>
    </div>
    <div class="sidebar-nav">
      <a href="admin.html">Dashboard</a>
      <a href="employees.html">Employees</a>
      <a href="leaves.html">Leave Requests</a>
      <a href="settings.html" class="active">Settings</a>
      <a href="payslip.html">Payslips</a>
    </div>
  </div>

  <div class="main-wrapper">
    <header>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <div>Company Settings</div>
      </div>
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </header>

    <div class="content-area">
      <div style="background: white; padding: 24px; border-radius: 8px; max-width: 500px;">
        <form id="settingsForm">
          <div class="form-group">
            <label>Office Start Time</label>
            <input type="time" id="startTime" required>
          </div>
          <div class="form-group">
            <label>Grace Minutes</label>
            <input type="number" id="graceMinutes" required>
          </div>
          <div class="form-group">
            <label>Yearly Leave Quota</label>
            <input type="number" id="leaveQuota" required>
          </div>
          <button type="submit" class="btn-primary">Save Settings</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    checkAuth("admin");

    function toggleSidebar() {
      const sidebar = document.querySelector(".sidebar");
      sidebar.classList.toggle("mobile-open");
    }

    const comp = DB.getCompany();

    document.getElementById("startTime").value = comp.startTime;
    document.getElementById("graceMinutes").value = comp.graceMinutes;
    document.getElementById("leaveQuota").value = comp.leaveQuota;

    document.getElementById("settingsForm").addEventListener("submit", (e) => {
      e.preventDefault();
      comp.startTime = document.getElementById("startTime").value;
      comp.graceMinutes = document.getElementById("graceMinutes").value;
      comp.leaveQuota = document.getElementById("leaveQuota").value;

      DB.setCompany(comp);
      alert("Settings saved successfully!");
    });
  </script>
</body>
</html>
