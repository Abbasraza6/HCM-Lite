<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Management - HCM Lite</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>HCM Lite</h2>
      <button onclick="toggleSidebar()" class="mobile-menu-btn">✕</button>
    </div>
    <div class="sidebar-nav" id="sidebarNavLinks"></div>
  </div>

  <div class="main-wrapper">
    <header>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <div id="headerTitle" style="font-weight: 600;">Leave Management</div>
      </div>
      <div class="header-user">
        <span id="headerUserName">User</span>
        <button class="btn-logout" onclick="handleLogout()">Logout</button>
      </div>
    </header>

    <div class="content-area" id="contentArea"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/leave.js"></script>
  <script>
    checkAuth();
    const session = DB.getSession();
    const contentArea = document.getElementById("contentArea");
    const navLinks = document.getElementById("sidebarNavLinks");

    if (session) {
      document.getElementById("headerUserName").innerText = session.name;
      if (session.role === "admin") {
        navLinks.innerHTML = `
          <a href="admin.html">Dashboard</a>
          <a href="employees.html">Employees</a>
          <a href="leaves.html" class="active">Leave Requests</a>
          <a href="settings.html">Settings</a>
          <a href="payslip.html">Payslips</a>
        `;
        renderAdminLeaves();
      } else {
        navLinks.innerHTML = `
          <a href="employee.html">My Dashboard</a>
          <a href="leaves.html" class="active">Leaves</a>
          <a href="payslip.html">My Payslip</a>
        `;
        renderEmployeeLeaves();
      }
    }

    function renderAdminLeaves() {
      const leaves = DB.getLeaves();
      let rows = leaves.map(l => `
        <tr>
          <td>${l.empName}</td>
          <td>${l.type}</td>
          <td>${l.from} to ${l.to} (${l.days} days)</td>
          <td>${l.reason}</td>
          <td><span style="color: ${l.status === 'Approved' ? 'var(--success)' : l.status === 'Rejected' ? 'var(--danger)' : 'var(--warning)'}; font-weight:600;">${l.status}</span></td>
          <td>${l.comment || '-'}</td>
          <td>
            ${l.status === 'Pending' ? `
              <button onclick="updateLeaveStatus(${l.id}, 'Approved')" class="btn-primary" style="padding: 6px 12px; font-size: 0.85rem; background: var(--success); margin-right: 6px;">Approve</button>
              <button onclick="updateLeaveStatus(${l.id}, 'Rejected')" class="btn-primary" style="padding: 6px 12px; font-size: 0.85rem; background: var(--danger);">Reject</button>
            ` : '-'}
          </td>
        </tr>
      `).join('');

      if (!rows) rows = `<tr><td colspan="7" style="text-align:center; color:var(--text-muted);">No leave requests found.</td></tr>`;

      contentArea.innerHTML = `
        <h2 style="margin-bottom: 24px; color: var(--text-dark);">Employee Leave Requests</h2>
        <div class="data-table-container">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Type</th>
                <th>Duration</th>
                <th>Reason</th>
                <th>Status</th>
                <th>Admin Comment</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderEmployeeLeaves() {
      const leaves = DB.getLeaves().filter(l => l.empId === session.id);
      let rows = leaves.map(l => `
        <tr>
          <td>${l.type}</td>
          <td>${l.from} to ${l.to} (${l.days} days)</td>
          <td>${l.reason}</td>
          <td><span style="color: ${l.status === 'Approved' ? 'var(--success)' : l.status === 'Rejected' ? 'var(--danger)' : 'var(--warning)'}; font-weight:600;">${l.status}</span></td>
          <td>${l.comment || '-'}</td>
        </tr>
      `).join('');

      if (!rows) rows = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">You haven't applied for any leaves yet.</td></tr>`;

      contentArea.innerHTML = `
        <div style="max-width: 700px; margin: 0 auto 32px auto;" class="chart-box">
          <h3 style="margin-bottom: 20px; color: var(--text-dark);">Apply for Leave</h3>
          <form id="leaveForm" onsubmit="submitLeaveRequest(event)">
            <div class="form-group">
              <label>Leave Type</label>
              <div class="input-wrapper">
                <select id="leaveType" required style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: #fff; border-radius: 12px;">
                  <option value="Casual" style="background: #1a1a1e;">Casual</option>
                  <option value="Sick" style="background: #1a1a1e;">Sick</option>
                  <option value="Annual" style="background: #1a1a1e;">Annual</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>From Date</label>
              <div class="input-wrapper">
                <input type="date" id="fromDate" required style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: #fff; border-radius: 12px;">
              </div>
            </div>
            <div class="form-group">
              <label>To Date</label>
              <div class="input-wrapper">
                <input type="date" id="toDate" required style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: #fff; border-radius: 12px;">
              </div>
            </div>
            <div class="form-group">
              <label>Reason</label>
              <div class="input-wrapper">
                <input type="text" id="leaveReason" required placeholder="Enter reason for leave" style="width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color); color: #fff; border-radius: 12px;">
              </div>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">Submit Request</button>
          </form>
        </div>

        <h3 style="margin-bottom: 20px; color: var(--text-dark);">My Leave History</h3>
        <div class="data-table-container">
          <table>
            <thead>
              <tr>
                <th>Type</th>
                <th>Duration</th>
                <th>Reason</th>
                <th>Status</th>
                <th>Admin Comment</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function toggleSidebar() {
      document.querySelector(".sidebar").classList.toggle("mobile-open");
    }
  </script>
</body>
</html>
