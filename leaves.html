<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Requests - HCM Lite</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header"><h2>HCM Lite</h2></div>
    <div class="sidebar-nav">
      <a href="admin.html">Dashboard</a>
      <a href="employees.html">Employees</a>
      <a href="leaves.html" class="active">Leave Requests</a>
      <a href="settings.html">Settings</a>
      <a href="payslip.html">Payslips</a>
    </div>
  </div>

  <div class="main-wrapper">
    <header>
      <div>Leave Requests Management</div>
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </header>

    <div class="content-area">
      <div class="data-table-container">
        <table>
          <thead>
            <tr>
              <th>Employee</th>
              <th>Type</th>
              <th>From - To</th>
              <th>Days</th>
              <th>Reason</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminLeavesTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/leave.js"></script>
  <script>
    checkAuth("admin");
    const leaves = DB.getLeaves();
    const tbody = document.getElementById("adminLeavesTable");

    tbody.innerHTML = leaves.map(l => `
      <tr>
        <td>${l.empName}</td>
        <td>${l.type}</td>
        <td>${l.from} to ${l.to}</td>
        <td>${l.days}</td>
        <td>${l.reason}</td>
        <td><span class="badge ${l.status === 'Approved' ? 'badge-success' : l.status === 'Rejected' ? 'badge-danger' : 'badge-warning'}">${l.status}</span></td>
        <td>
          ${l.status === 'Pending' ? `
            <button onclick="updateLeaveStatus(${l.id}, 'Approved')" style="color: green; cursor:pointer;">Approve</button>
            <button onclick="updateLeaveStatus(${l.id}, 'Rejected')" style="color: red; cursor:pointer;">Reject</button>
          ` : '-'}
        </td>
      </tr>
    `).join("");
  </script>
</body>
</html>
