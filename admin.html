<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - HCM Lite</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header"><h2>HCM Lite</h2></div>
    <div class="sidebar-nav">
      <a href="admin.html" class="active">Dashboard</a>
      <a href="employees.html">Employees</a>
      <a href="leaves.html">Leave Requests</a>
      <a href="settings.html">Settings</a>
      <a href="payslip.html">Payslips</a>
    </div>
  </div>

  <div class="main-wrapper">
    <header>
      <div id="companyTitle" style="font-weight: 600; font-size: 1.1rem;">Company Name</div>
      <div class="header-user">
        <span id="userName">Admin</span>
        <button class="btn-logout" onclick="handleLogout()">Logout</button>
      </div>
    </header>

    <div class="content-area">
      <div class="card-grid">
        <div class="stat-card">
          <h3>Total Employees</h3>
          <div class="value" id="totalEmpCount" style="color: #4f46e5;">0</div>
        </div>
        <div class="stat-card">
          <h3>Present Today</h3>
          <div class="value" id="presentTodayCount" style="color: #0d9488;">0</div>
        </div>
        <div class="stat-card">
          <h3>On leave</h3>
          <div class="value" id="onLeaveCount" style="color: #d97706;">0</div>
        </div>
        <div class="stat-card">
          <h3>Late</h3>
          <div class="value" id="lateCount" style="color: #7c3aed;">0</div>
        </div>
      </div>

      <div class="charts-container">
        <div class="chart-box">
          <h3 style="font-size: 1rem; color: var(--text-muted); margin-bottom: 16px;">Attendance by department</h3>
          <div style="position: relative; height: 240px; width: 100%;">
            <canvas id="deptChart"></canvas>
          </div>
        </div>

        <div class="chart-box">
          <h3 style="font-size: 1rem; color: var(--text-muted); margin-bottom: 16px;">Trend</h3>
          <div style="position: relative; height: 240px; width: 100%;">
            <canvas id="trendChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="chat-toggle-btn" onclick="toggleChat()">💬 AI Helper</button>

  <div class="chat-widget" id="chatWidget">
    <div class="chat-header">
      <span>Smart Helper</span>
      <button onclick="toggleChat()" style="background: none; border: none; color: white; cursor: pointer; font-size: 1rem;">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="Ask something...">
      <button onclick="sendChatMessage()" class="btn-primary">Send</button>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/helper.js"></script>
  <script>
    checkAuth("admin");
    
    document.getElementById("companyTitle").innerText = DB.getCompany().name;
    document.getElementById("userName").innerText = DB.getSession().name;

    function toggleChat() {
      const widget = document.getElementById("chatWidget");
      widget.classList.toggle("active");
    }

    const today = new Date().toISOString().split("T")[0];
    const attendance = DB.getAttendance();
    const users = DB.getUsers();

    const employees = users.filter(u => u.role === "employee");
    document.getElementById("totalEmpCount").innerText = employees.length;

    const presentCount = attendance.filter(a => a.date === today && a.status === "Present").length;
    const lateCount = attendance.filter(a => a.date === today && a.status === "Late").length;
    document.getElementById("presentTodayCount").innerText = presentCount;
    document.getElementById("lateCount").innerText = lateCount;

    const leaves = DB.getLeaves().filter(l => l.status === "Approved" && l.from <= today && l.to >= today);
    document.getElementById("onLeaveCount").innerText = leaves.length;

    const deptCounts = { IT: 0, HR: 0, Finance: 0 };
    attendance.forEach(a => {
      if (a.date === today && (a.status === "Present" || a.status === "Late")) {
        const emp = users.find(u => u.id === a.empId);
        if (emp && deptCounts[emp.department] !== undefined) {
          deptCounts[emp.department]++;
        }
      }
    });

    const ctxDept = document.getElementById('deptChart').getContext('2d');
    new Chart(ctxDept, {
      type: 'bar',
      data: {
        labels: ['IT', 'HR', 'Finance'],
        datasets: [{
          label: 'Attendance',
          data: [deptCounts.IT, deptCounts.HR, deptCounts.Finance],
          backgroundColor: ['#0d9488', '#0d9488', '#7c3aed'],
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1 } }
        }
      }
    });

    const getPastDateStr = (daysAgo) => {
      const d = new Date();
      d.setDate(d.getDate() - daysAgo);
      return d.toISOString().split("T")[0];
    };

    const trendData = [4, 3, 2, 1, 0].map(daysAgo => {
      const dateStr = getPastDateStr(daysAgo);
      return attendance.filter(a => a.date === dateStr && (a.status === "Present" || a.status === "Late")).length;
    });

    const ctxTrend = document.getElementById('trendChart').getContext('2d');
    new Chart(ctxTrend, {
      type: 'line',
      data: {
        labels: ['4d ago', '3d ago', '2d ago', 'Yesterday', 'Today'],
        datasets: [{
          label: 'Attendance Trend',
          data: trendData,
          borderColor: '#f59e0b',
          tension: 0.3,
          fill: false
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1 } }
        }
      }
    });
  </script>
</body>
</html>
