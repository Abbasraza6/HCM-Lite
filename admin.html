<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - HCM Lite</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>HCM Lite</h2>
      <button onclick="toggleSidebar()" class="mobile-menu-btn">✕</button>
    </div>
    <div class="sidebar-nav">
      <a href="admin.html" class="active">Dashboard</a>
      <a href="employees.html">Employees</a>
      <a href="leaves.html">Leave Requests</a>
      <a href="settings.html">Settings</a>
      <a href="payslip.html">Payslips</a>
    </div>
  </div>

  <div class="main-wrapper">
    <header>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <div style="font-weight: 600;">Admin Dashboard</div>
      </div>
      <div class="header-user">
        <span id="headerUserName">Admin User</span>
        <button class="btn-logout" onclick="handleLogout()">Logout</button>
      </div>
    </header>

    <div class="content-area">
      <div class="card-grid">
        <div class="stat-card">
          <h3>Total Employees</h3>
          <div class="value" id="statTotalEmp">0</div>
        </div>
        <div class="stat-card">
          <h3>Pending Leaves</h3>
          <div class="value" id="statPendingLeaves">0</div>
        </div>
        <div class="stat-card">
          <h3>Present Today</h3>
          <div class="value" id="statPresentToday">0</div>
        </div>
      </div>

      <div class="charts-container">
        <div class="chart-box">
          <h3 style="margin-bottom: 16px; color: var(--text-dark);">Attendance Trend (Last 5 Days)</h3>
          <div style="position: relative; height: 260px; width: 100%;">
            <canvas id="trendChart"></canvas>
          </div>
        </div>
        <div class="chart-box">
          <h3 style="margin-bottom: 16px; color: var(--text-dark);">Quick Actions</h3>
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <button onclick="location.href='employees.html'" class="btn-primary" style="text-align: left;">Manage Employees</button>
            <button onclick="location.href='leaves.html'" class="btn-primary" style="text-align: left; background: var(--card-bg); border: 1px solid var(--border-color);">Review Leave Requests</button>
            <button onclick="location.href='settings.html'" class="btn-primary" style="text-align: left; background: var(--card-bg); border: 1px solid var(--border-color);">System Settings</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    checkAuth();
    const session = DB.getSession();
    if (session) {
      document.getElementById("headerUserName").innerText = session.name;
    }

    const employees = DB.getEmployees ? DB.getEmployees() : [];
    const leaves = DB.getLeaves ? DB.getLeaves() : [];
    const attendance = DB.getAttendance ? DB.getAttendance() : [];

    document.getElementById("statTotalEmp").innerText = employees.length;
    document.getElementById("statPendingLeaves").innerText = leaves.filter(l => l.status === "Pending").length;
    
    const todayStr = new Date().toISOString().split('T')[0];
    const presentToday = attendance.filter(a => a.date === todayStr && (a.status === "Present" || a.status === "Late")).length;
    document.getElementById("statPresentToday").innerText = presentToday;

    const getPastDateStr = (daysAgo) => {
      const d = new Date();
      d.setDate(d.getDate() - daysAgo);
      return d.toISOString().split('T')[0];
    };

    const trendData = [4, 3, 2, 1, 0].map(daysAgo => {
      const dateStr = getPastDateStr(daysAgo);
      return attendance.filter(a => a.date === dateStr && (a.status === "Present" || a.status === "Late")).length;
    });

    const ctxTrend = document.getElementById('trendChart').getContext('2d');
    new Chart(ctxTrend, {
      type: 'line',
      data: {
        labels: ['4d ago', '3d ago', '2d ago', 'Yesterday', 'Today'],
        datasets: [{
          label: 'Attendance Trend',
          data: trendData,
          borderColor: '#f59e0b',
          tension: 0.3,
          fill: false
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1 } }
        }
      }
    });

    function toggleSidebar() {
      document.querySelector(".sidebar").classList.toggle("mobile-open");
    }
  </script>
</body>
</html>
