<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payslip - HCM Lite</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>HCM Lite</h2>
      <button onclick="toggleSidebar()" class="mobile-menu-btn">✕</button>
    </div>
    <div class="sidebar-nav" id="sidebarNavLinks"></div>
  </div>

  <div class="main-wrapper">
    <header>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <div id="headerTitle" style="font-weight: 600;">Payslip</div>
      </div>
      <div class="header-user">
        <span id="headerUserName">User</span>
        <button class="btn-logout" onclick="handleLogout()">Logout</button>
      </div>
    </header>

    <div class="content-area" id="contentArea"></div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    checkAuth();
    const session = DB.getSession();
    const contentArea = document.getElementById("contentArea");
    const navLinks = document.getElementById("sidebarNavLinks");

    if (session) {
      document.getElementById("headerUserName").innerText = session.name;
      if (session.role === "admin") {
        navLinks.innerHTML = `
          <a href="admin.html">Dashboard</a>
          <a href="employees.html">Employees</a>
          <a href="leaves.html">Leave Requests</a>
          <a href="settings.html">Settings</a>
          <a href="payslip.html" class="active">Payslips</a>
        `;
        renderAdminPayslips();
      } else {
        navLinks.innerHTML = `
          <a href="employee.html">My Dashboard</a>
          <a href="leaves.html">Leaves</a>
          <a href="payslip.html" class="active">My Payslip</a>
        `;
        renderEmployeePayslip();
      }
    }

    function renderAdminPayslips() {
      const employees = JSON.parse(localStorage.getItem("hcm_employees")) || [
        { id: 1, name: "raza", email: "raza@gmail.com", department: "IT", salary: 100000 }
      ];
      let rows = employees.map(emp => `
        <tr>
          <td>${emp.name}</td>
          <td>${emp.email}</td>
          <td>${emp.department || 'General'}</td>
          <td>PKR ${(emp.salary || 100000).toLocaleString()}</td>
          <td>
            <button onclick="viewPayslipDetail(${emp.id})" class="btn-primary" style="padding: 6px 12px; font-size: 0.85rem;">View Payslip</button>
          </td>
        </tr>
      `).join('');

      if (!rows) rows = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">No employees found.</td></tr>`;

      contentArea.innerHTML = `
        <h2 style="margin-bottom: 24px; color: var(--text-dark);">Employee Payslips</h2>
        <div class="data-table-container">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Base Salary</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function viewPayslipDetail(empId) {
      const employees = JSON.parse(localStorage.getItem("hcm_employees")) || [];
      const emp = employees.find(e => e.id === empId) || { name: session.name, department: session.department, email: session.email, salary: session.salary || 100000 };
      
      const workingDaysInMonth = 22;
      const perDaySalary = (emp.salary || 100000) / workingDaysInMonth;
      const deductions = 0;
      const net = (emp.salary || 100000) - deductions;

      contentArea.innerHTML = `
        ${session.role === 'admin' ? '<button onclick="renderAdminPayslips()" class="btn-primary" style="margin-bottom: 20px; background: var(--card-bg); border: 1px solid var(--border-color);">← Back to List</button>' : ''}
        <div style="max-width: 700px; margin: 0 auto;" class="chart-box" id="printablePayslip">
          <h2 style="margin-bottom: 8px; color: var(--text-dark); text-align: center;">Payslip</h2>
          <p style="text-align: center; color: var(--text-muted); margin-bottom: 24px;">HCM Lite Inc.</p>
          <hr style="border: 0; border-top: 1px solid var(--border-color); margin-bottom: 24px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
            <div><strong>Employee Name:</strong> ${emp.name}</div>
            <div><strong>Department:</strong> ${emp.department || 'General'}</div>
            <div><strong>Email:</strong> ${emp.email}</div>
            <div><strong>Date:</strong> ${new Date().toLocaleDateString()}</div>
          </div>
          <table style="width: 100%; margin-bottom: 24px;">
            <tr>
              <td><strong>Base Salary</strong></td>
              <td style="text-align: right;">PKR ${(emp.salary || 100000).toLocaleString()}</td>
            </tr>
            <tr>
              <td><strong>Deductions</strong></td>
              <td style="text-align: right; color: var(--danger);">PKR ${deductions.toFixed(2)}</td>
            </tr>
            <tr>
              <td><strong>Net Salary</strong></td>
              <td style="text-align: right; color: var(--success); font-weight: 700;">PKR ${net.toFixed(2)}</td>
            </tr>
          </table>
          <button onclick="window.print()" class="btn-primary" style="width: 100%;">Print Payslip</button>
        </div>
      `;
    }

    function renderEmployeePayslip() {
      viewPayslipDetail(session.id);
    }

    function toggleSidebar() {
      document.querySelector(".sidebar").classList.toggle("mobile-open");
    }
  </script>
</body>
</html>
