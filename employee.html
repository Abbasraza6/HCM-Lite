<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Dashboard - HCM Lite</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>HCM Lite</h2>
      <button onclick="toggleSidebar()" class="mobile-menu-btn">✕</button>
    </div>
    <div class="sidebar-nav">
      <a href="employee.html" class="active">My Dashboard</a>
      <a href="leaves.html">Leaves</a>
      <a href="payslip.html">My Payslip</a>
    </div>
  </div>

  <div class="main-wrapper">
    <header>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <div style="font-weight: 600;">Employee Dashboard</div>
      </div>
      <div class="header-user">
        <span id="headerUserName">Employee</span>
        <button class="btn-logout" onclick="handleLogout()">Logout</button>
      </div>
    </header>

    <div class="content-area">
      <div class="card-grid">
        <div class="stat-card">
          <h3>Leave Quota</h3>
          <div class="value" id="statLeaveQuota">20</div>
        </div>
        <div class="stat-card">
          <h3>Used Leaves</h3>
          <div class="value" id="statUsedLeaves">0</div>
        </div>
        <div class="stat-card">
          <h3>My Salary</h3>
          <div class="value" id="statSalary">PKR 100,000</div>
        </div>
      </div>

      <div class="chart-box">
        <h3 style="margin-bottom: 16px; color: var(--text-dark);">Quick Actions</h3>
        <div style="display: flex; gap: 16px;">
          <button onclick="location.href='leaves.html'" class="btn-primary">Apply for Leave</button>
          <button onclick="location.href='payslip.html'" class="btn-primary" style="background: var(--card-bg); border: 1px solid var(--border-color);">View My Payslip</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    checkAuth();
    const session = DB.getSession();
    if (session) {
      document.getElementById("headerUserName").innerText = session.name;
      if (session.salary) {
        document.getElementById("statSalary").innerText = "PKR " + session.salary.toLocaleString();
      }
    }

    const leaves = DB.getLeaves ? DB.getLeaves() : [];
    const used = leaves.filter(l => l.empId === session.id && l.status === "Approved").reduce((sum, l) => sum + l.days, 0);
    document.getElementById("statUsedLeaves").innerText = used;

    function toggleSidebar() {
      document.querySelector(".sidebar").classList.toggle("mobile-open");
    }
  </script>
</body>
</html>
