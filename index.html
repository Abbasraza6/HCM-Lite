<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HCM Lite</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--bg-main);
    }
    .login-card {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .login-card h2 {
      margin-bottom: 24px;
      color: var(--text-dark);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Login to HCM Lite</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" required placeholder="admin@hcmlite.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      <div id="loginError" class="error-text" style="margin-bottom: 12px; text-align: center;"></div>
      <button type="submit" class="btn-primary" style="width: 100%;">Submit</button>
    </form>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
